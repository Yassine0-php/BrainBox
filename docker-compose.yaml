services:

  backend:
    build:
      context: ./back-express
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    networks:
      - back-tier
    depends_on:
      - ollama


  ollama:
    image: ollama/ollama
    container_name: brainbox-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - back-tier
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]


volumes:
  ollama_data:


networks:
  back-tier:
    driver: bridge